name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run router path and allowlist tests
        run: php tests/router-path-test.php

      - name: Run IBSng lookup contract test
        run: php tests/ibsng-lookup-contract-test.php

      - name: Run IBSng renewal policy test
        run: php tests/ibsng-renewal-policy-test.php

      - name: Run IBSng renewal state test
        run: php tests/ibsng-renewal-state-test.php

      - name: Run IBSng renewal ledger contract test
        run: php tests/ibsng-renewal-coordinator-contract-test.php
