name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run router path and allowlist tests
        run: php tests/router-path-test.php

      - name: Run global pricing conversion test
        run: php tests/pricing-display-test.php

      - name: Run payment amount contract test
        run: php tests/PaymentAmountTest.php

      - name: Run payment manager allowlist test
        run: php tests/PaymentManagerTest.php

      - name: Run multi-gateway payment contract test
        run: php tests/multi-gateway-payment-contract-test.php

      - name: Run Zarinpal sandbox and local font contract test
        run: php tests/zarinpal-sandbox-contract-test.php

      - name: Run customer order account display contract test
        run: php tests/order-status-account-contract-test.php

      - name: Run IBSng lookup contract test
        run: php tests/ibsng-lookup-contract-test.php

      - name: Run IBSng provisioning subscription contract test
        run: php tests/ibsng-provisioning-subscription-contract-test.php

      - name: Run credential generation contract test
        run: php tests/credential-generation-contract-test.php

      - name: Run IBSng renewal policy test
        run: php tests/ibsng-renewal-policy-test.php

      - name: Run IBSng renewal state test
        run: php tests/ibsng-renewal-state-test.php

      - name: Run IBSng renewal ledger contract test
        run: php tests/ibsng-renewal-coordinator-contract-test.php

      - name: Run UI presentation contract test
        run: node tests/ui-presentation-contract.js

      - name: Run bilingual email and presentation contract test
        run: php tests/email-language-presentation-contract-test.php
